[project]
name = "anchor-demo"
version = "0.1.0"
description = "OrderDesk, a three agent LangGraph demo built on the Anchor Engine"
requires-python = ">=3.9"
dependencies = [
    "langgraph>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anchor_demo*"]
